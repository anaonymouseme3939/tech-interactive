[device]
name=tech-interactive-node-01
device_id=ESP32-001
mac_address=auto
node_type=rssi_csi
firmware_version=1.0.0
build_timestamp=auto

[wifi]
ssid=YOUR_WIFI_SSID
password=YOUR_WIFI_PASSWORD
max_retries=10
connection_timeout=15
power_save=false
channel=0
bssid=

[mqtt]
enable=true
host=192.168.1.20
port=1883
username=
password=
client_id=tech-interactive-esp32
keepalive=60
qos=1
retain=false
tls_enable=false
tls_ca_cert=
tls_client_cert=
tls_client_key=
topics_publish_signal=tech_interactive/ESP32-001/signal
topics_publish_status=tech_interactive/ESP32-001/status
topics_publish_heartbeat=tech_interactive/ESP32-001/heartbeat
topics_subscribe_command=tech_interactive/ESP32-001/command
reconnect_interval=5
max_reconnect_attempts=10

[udp]
enable=false
target_ip=192.168.1.20
target_port=5006
local_port=5005
broadcast=false
multicast_group=224.0.0.1
multicast_port=5004

[signal_acquisition]
mode=rssi
channels=1,6,11
channel_hop=true
channel_dwell_ms=100
sample_rate=100
samples_per_packet=10
csi_enable=false
rssi_raw=true
packet_count_interval=1000
signal_strength_threshold=-90

[signal_processing]
kalman_enable=true
kalman_q=0.01
kalman_r=0.1
kalman_p_init=1.0
median_filter_enable=true
median_window_size=5
hampel_filter_enable=true
hampel_threshold=3.0
hampel_window=5
detrending_enable=true
detrending_order=1
normalization_enable=true
normalization_window=100

[fft_analysis]
fft_enable=true
fft_size=256
overlap_ratio=0.5
window_function=hamming
frequency_resolution=0.39
num_freq_bins=128

[bandpass_filtering]
breathing_low_hz=0.10
breathing_high_hz=0.50
heart_low_hz=0.80
heart_high_hz=2.00
motion_low_hz=0.50
motion_high_hz=10.00
filter_order=4
filter_type=butterworth

[presence_detection]
enable=true
confidence_threshold=0.95
minimum_frames_detection=8
minimum_frames_removal=12
presence_timeout_seconds=12
presence_hysteresis=0.05
adaptive_baseline_enable=true
baseline_window_frames=100
baseline_update_rate=0.95
baseline_threshold_multiplier=2.5
presence_decay_rate=0.98
energy_threshold_factor=1.2
variance_threshold_factor=1.5
rolling_window_size=20

[motion_detection]
enable=true
motion_threshold=0.12
motion_variance_threshold=0.08
motion_energy_threshold=0.15
motion_debounce_frames=3
motion_cooldown_seconds=5
motion_minimum_duration=1
motion_fade_frames=10
motion_confidence_gate=0.85
motion_decay_rate=0.96
motion_spike_rejection=true
motion_spike_multiplier=3.0

[breathing_detection]
enable=true
breathing_confidence_threshold=0.80
breathing_minimum_frequency=0.10
breathing_maximum_frequency=0.50
breathing_rate_smoothing=0.8
breathing_trend_window=30
breathing_detection_window=60
breathing_minimum_power=0.05
breathing_snoring_rejection=true
breathing_snoring_threshold=1.5

[heart_rate_estimation]
enable=true
heart_confidence_threshold=0.75
heart_minimum_frequency=0.80
heart_maximum_frequency=2.00
heart_rate_smoothing=0.85
heart_trend_window=60
heart_detection_window=120
heart_minimum_power=0.03
heart_rhythm_detection=true
heart_arrhythmia_threshold=0.3

[fall_detection]
enable=true
fall_confidence_threshold=0.90
fall_motion_spike_threshold=2.5
fall_energy_spike_threshold=3.0
fall_debounce_frames=5
fall_cooldown_seconds=30
fall_minimum_duration=2
fall_recovery_time=5
fall_alert_enabled=true

[sleep_detection]
enable=true
sleep_confidence_threshold=0.80
sleep_motion_threshold=0.05
sleep_breathing_detection=true
sleep_heart_variability_threshold=0.3
sleep_stage_classification=true
sleep_minimum_duration=300
sleep_debug_mode=false

[activity_classification]
enable=true
activity_confidence_threshold=0.80
activity_smoothing=0.85
activity_transition_debounce=3
activities=idle,walking,sitting,standing,lying,running,jumping
idle_motion_threshold=0.05
walking_motion_threshold=0.20
running_motion_threshold=0.50

[occupancy_estimation]
enable=true
occupancy_confidence_threshold=0.85
occupancy_minimum_frames=10
occupancy_timeout_seconds=60
multi_person_detection=true
person_count_threshold=0.70
person_distance_threshold=0.5
occupancy_hysteresis=0.10

[gesture_recognition]
enable=false
gesture_confidence_threshold=0.85
gesture_minimum_duration=1
gesture_maximum_duration=10
gestures=wave,clap,raise_hand,thumbs_up
gesture_smoothing=0.80

[environment_learning]
enable=true
learning_enable=true
learning_time_seconds=30
learning_min_samples=300
environment_learning_window=3600
adaptive_retraining=true
retraining_interval_seconds=300
retraining_min_samples=100
noise_baseline_update_rate=0.95
signal_envelope_learning=true
envelope_smoothing_factor=0.90
environment_signature_enable=true
room_acoustics_learning=true

[false_alarm_prevention]
enable=true
frame_voting_enable=true
frame_voting_window=8
debounce_enable=true
debounce_frames=8
debounce_frames_minimum=6
cooldown_enable=true
cooldown_seconds=5
required_confidence=0.95
hysteresis_enable=true
hysteresis_presence=0.08
hysteresis_motion=0.10
ghost_suppression_enable=true
ghost_suppression_frames=20
ghost_decay_rate=0.85
fan_rejection_enable=true
fan_frequency_low=45
fan_frequency_high=65
fan_harmonic_threshold=0.6
ac_rejection_enable=true
ac_frequency=50
ac_harmonic_threshold=0.5
microwave_rejection_enable=true
microwave_frequency_threshold=2.0
pet_rejection_enable=true
pet_motion_threshold=0.25
pet_breathing_threshold=0.35
door_movement_rejection=true
door_energy_spike_threshold=2.0
window_movement_rejection=true
window_frequency_threshold=0.3
interference_rejection_enable=true
interference_threshold=0.8
occupancy_hysteresis_enable=true
occupancy_on_threshold=0.70
occupancy_off_threshold=0.60
confidence_decay_rate=0.98
alarm_lockout_seconds=10
false_positive_learning=true
false_positive_window=60

[noise_reduction]
enable=true
noise_gate_enable=true
noise_gate_threshold=0.02
noise_gate_hysteresis=0.03
spectral_subtraction_enable=true
spectral_subtraction_factor=0.8
wiener_filtering_enable=true
wiener_smoothing_factor=0.9
noise_print_duration=2
noise_print_adaptation=0.98

[signal_validation]
enable=true
null_packet_rejection=true
rssi_range_validation=true
rssi_min=-100
rssi_max=-20
variance_validation=true
variance_max=100
phase_continuity_check=true
phase_jump_threshold=1.5
packet_rate_validation=true
packet_rate_min=10
packet_rate_max=1000
crc_validation=true
timestamp_validation=true
timestamp_max_gap_ms=5000

[watchdog]
enable=true
watchdog_timeout_seconds=5
heartbeat_interval_ms=1000
sensor_timeout_seconds=10
mqtt_timeout_seconds=15
recovery_enable=true
recovery_max_attempts=5
recovery_backoff_factor=1.5
recovery_max_backoff=30
safe_mode_enable=true
safe_mode_reduced_sample_rate=50
safe_mode_disable_csi=true
safe_mode_disable_gestures=true
graceful_shutdown_timeout=10

[telemetry]
enable=true
compression_enable=true
compression_threshold=1000
heartbeat_enabled=true
heartbeat_interval_ms=5000
status_interval_ms=10000
signal_log_enable=true
signal_log_interval_ms=1000
detailed_metrics=false
debug_mode=false

[power_management]
power_save_enable=false
modem_sleep=false
light_sleep=false
deep_sleep=false
deep_sleep_duration_seconds=300
wake_stub_enable=false

[pin_configuration]
led_status=2
button_reset=0
button_config=35
adc_battery=34
spi_mosi=23
spi_miso=19
spi_clk=18
spi_cs=5
i2c_sda=21
i2c_scl=22
uart_tx=1
uart_rx=3

[advanced_features]
enable_phase_tracking=true
enable_csi_processing=false
enable_beam_forming=false
enable_null_steering=false
enable_direction_finding=false
enable_frequency_hopping=false
enable_adaptive_antennas=false
enable_polarization_detection=false
enable_multipath_analysis=false
enable_rf_fingerprinting=false

[calibration]
rssi_offset=0
phase_offset=0
antenna_gain_correction=0
temperature_compensation=false
temperature_reference=25
temperature_coefficient=0.01

[logging]
enable=true
log_level=INFO
log_to_serial=true
log_to_spiffs=true
log_to_sd=false
serial_baud_rate=115200
log_buffer_size=4096
log_flush_interval_ms=1000
event_logging=true
signal_snapshot=false
signal_snapshot_interval=10000
connection_logging=true
error_logging=true
warning_logging=true
debug_logging=false
performance_metrics=true
memory_monitoring=true
thermal_monitoring=false

[storage]
spiffs_enable=true
spiffs_partition_size=3145728
spiffs_auto_format=false
nvs_enable=true
nvs_namespace=tech_interactive
config_auto_save=true
config_save_interval_seconds=300
event_log_retention_days=7
signal_log_retention_days=1
max_log_file_size=1048576
log_rotation_enable=true

[developer_options]
debug_output=false
verbose_logging=false
memory_dump_enable=false
performance_profiling=false
signal_injection_mode=false
test_mode=false
simulation_mode=false
bypass_wifi=false
bypass_mqtt=false
force_safe_mode=false
disable_recovery=false
disable_watchdog=false

[network_optimization]
dns_server_primary=8.8.8.8
dns_server_secondary=8.8.4.4
ntp_server=pool.ntp.org
time_sync_enable=true
tcp_keep_alive=true
tcp_keep_alive_interval=60
udp_timeout=30
network_timeout_ms=5000
connection_retry_delay_ms=1000

[update_configuration]
ota_enable=true
ota_check_interval_hours=24
ota_auto_install=false
ota_verify_signature=true
rollback_on_failure=true
version_info_reporting=true

[regional_settings]
timezone=UTC
latitude=0.0
longitude=0.0
altitude=0
region_code=US
environmental_region=urban
building_material=concrete
wall_thickness_cm=20
